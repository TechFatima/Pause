spring.application.name=backend

# Import local secrets file (your sandbox keys). "optional:" means the app
# still starts if the file is missing - useful for other developers.
spring.config.import=optional:classpath:application-local.properties

# JPA: recreate the H2 tables on every startup (fine for a demo with seeded data).
spring.jpa.hibernate.ddl-auto=create-drop

# Base URL used by PayPalClient for return/cancel redirects after buyer approval.
# Override this with your public HTTPS URL when deploying (e.g. https://myapp.ngrok.io).
paypal.callback-base-url=http://localhost:8080
